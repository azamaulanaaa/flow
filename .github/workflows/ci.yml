name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typescript:
    name: typescript (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  node:
    name: node (test + build + validate + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: node dist/validate.js
      - name: smoke (boot + graceful shutdown)
        run: |
          node dist/index.js > boot.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            sleep 1
            if grep -q "started: cron" boot.log; then break; fi
          done
          if ! grep -q "started: cron" boot.log; then cat boot.log; kill -TERM "$pid" || true; exit 1; fi
          kill -TERM "$pid" || true
          if wait "$pid"; then code=0; else code=$?; fi
          cat boot.log
          test "$code" -eq 0
          grep -q "Shutdown complete" boot.log

  bun:
    name: bun (test + validate + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: bun node_modules/vitest/vitest.mjs run
      - run: bun src/validate.ts
      - name: smoke (boot + graceful shutdown)
        run: |
          bun src/index.ts > boot.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            sleep 1
            if grep -q "started: cron" boot.log; then break; fi
          done
          if ! grep -q "started: cron" boot.log; then cat boot.log; kill -TERM "$pid" || true; exit 1; fi
          kill -TERM "$pid" || true
          if wait "$pid"; then code=0; else code=$?; fi
          cat boot.log
          test "$code" -eq 0
          grep -q "Shutdown complete" boot.log

  deno:
    name: deno (test + validate + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno install
      - run: deno task test
      - run: deno run --allow-all src/validate.ts
      - name: smoke (boot + graceful shutdown)
        run: |
          deno run --allow-all src/index.ts > boot.log 2>&1 &
          pid=$!
          for i in $(seq 1 150); do
            sleep 1
            if grep -q "started: cron" boot.log; then break; fi
          done
          if ! grep -q "started: cron" boot.log; then cat boot.log; kill -TERM "$pid" || true; exit 1; fi
          kill -TERM "$pid" || true
          if wait "$pid"; then code=0; else code=$?; fi
          cat boot.log
          test "$code" -eq 0
          grep -q "Shutdown complete" boot.log
